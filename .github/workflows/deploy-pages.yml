name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 站点根 index.html 由单文件自包含原型生成。
      # 源文件名含中文，这里用 glob 匹配，避免 workflow 中出现非 ASCII 字面量。
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          src=$(find seaside-landing -maxdepth 1 -name 'prototype-*.html' -print -quit)
          if [ -z "$src" ]; then
            echo "::error::未找到 prototype-*.html 原型文件"; exit 1
          fi
          echo "源文件: $src"
          cp "$src" _site/index.html
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
